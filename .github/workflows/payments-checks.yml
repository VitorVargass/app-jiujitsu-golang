name: Validar pagamentos

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/payments-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/payments-checks.yml'

permissions:
  contents: read

jobs:
  payments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: payments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d payments_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Testar configuracao e pagamentos sem provedor real
        run: go test ./internal/config ./internal/payments ./internal/subscriptions
      - name: Testar pagamentos e assinatura com banco descartavel
        env:
          TEST_DATABASE_URL: postgres://test:isolated-test-only@localhost:5432/payments_test?sslmode=disable
        run: go test ./internal/httpapi -run 'TestInfinitePayFlow|TestPlatformSubscription' -count=1
