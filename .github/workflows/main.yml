name: Validar e publicar backend

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: payments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d payments_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Preparar Docker
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Preparar Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Testar configuracao e pagamentos sem provedor real
        working-directory: backend
        run: go test ./internal/auth ./internal/config ./internal/payments ./internal/subscriptions

      - name: Testar pagamentos e planos com banco descartavel
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:isolated-test-only@localhost:5432/payments_test?sslmode=disable
        run: go test -p 1 ./internal/subscriptions ./internal/httpapi -run 'TestSubscriptionPlanDatabase|TestTrialPaymentPreservesFreeDays|TestInfinitePayFlow|TestPlatformSubscription|TestOnboardingContract' -count=1

      - name: Entrar no registro Azure
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Construir e publicar somente o backend
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/tatamemix-api:${{ github.sha }}
