services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tatame
      POSTGRES_PASSWORD: tatame_dev
      POSTGRES_DB: tatame
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tatame"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://tatame:tatame_dev@postgres:5432/tatame?sslmode=disable
      HTTP_ADDR: :8080
      ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
